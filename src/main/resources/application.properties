spring.application.name=secret-api

# Nova URL usando a variavel DATABASE_URL padrao do Render, que contem todas as credenciais (host, porta, user, senha, dbname)
spring.datasource.url=${DATABASE_URL}?sslmode=require

spring.datasource.driver-class-name=org.postgresql.Driver

# As linhas abaixo se tornam REDUNDANTES/CAUSADORAS DE CONFLITO quando usamos DATABASE_URL
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.username=${DB_USER}

# --- NOVO AJUSTE CRÍTICO (Manter) ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
